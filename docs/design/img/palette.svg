<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Thailand Humanoid Atlas colour palette</title>
  <desc id="d">Eleven colour tokens taken from app/globals.css: three cream surfaces, two charcoal text colours, two forest greens, a dark shell green, gold, amber and red.</desc>
  <rect width="960" height="360" fill="#ffffff"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" font-size="14">
    <!-- row 1 -->
    <rect x="20"  y="20" width="170" height="110" rx="8" fill="#faf6f0" stroke="#d9d2c4"/>
    <text x="32" y="106" fill="#2e3230" font-weight="700">Background</text><text x="32" y="124" fill="#5e6661">#FAF6F0</text>
    <rect x="200" y="20" width="170" height="110" rx="8" fill="#ffffff" stroke="#d9d2c4"/>
    <text x="212" y="106" fill="#2e3230" font-weight="700">Surface</text><text x="212" y="124" fill="#5e6661">#FFFFFF</text>
    <rect x="380" y="20" width="170" height="110" rx="8" fill="#f4f0e8" stroke="#d9d2c4"/>
    <text x="392" y="106" fill="#2e3230" font-weight="700">Surface muted</text><text x="392" y="124" fill="#5e6661">#F4F0E8</text>
    <rect x="560" y="20" width="170" height="110" rx="8" fill="#2e3230"/>
    <text x="572" y="106" fill="#ffffff" font-weight="700">Text primary</text><text x="572" y="124" fill="#d8dcd9">#2E3230</text>
    <rect x="740" y="20" width="200" height="110" rx="8" fill="#5e6661"/>
    <text x="752" y="106" fill="#ffffff" font-weight="700">Text secondary</text><text x="752" y="124" fill="#e6e9e7">#5E6661</text>
    <!-- row 2 -->
    <rect x="20"  y="150" width="170" height="110" rx="8" fill="#4a7c59"/>
    <text x="32" y="236" fill="#ffffff" font-weight="700">Accent (forest)</text><text x="32" y="254" fill="#e4efe8">#4A7C59</text>
    <rect x="200" y="150" width="170" height="110" rx="8" fill="#365b41"/>
    <text x="212" y="236" fill="#ffffff" font-weight="700">Accent strong</text><text x="212" y="254" fill="#e4efe8">#365B41</text>
    <rect x="380" y="150" width="170" height="110" rx="8" fill="#0b1a15"/>
    <text x="392" y="236" fill="#ffffff" font-weight="700">Dark shell</text><text x="392" y="254" fill="#cfd8d3">#0B1A15</text>
    <rect x="560" y="150" width="170" height="110" rx="8" fill="#d6be67"/>
    <text x="572" y="236" fill="#2e3230" font-weight="700">Gold on dark</text><text x="572" y="254" fill="#2e3230">#D6BE67</text>
    <rect x="740" y="150" width="95" height="110" rx="8" fill="#705c30"/>
    <text x="748" y="236" fill="#ffffff" font-weight="700">Warning</text><text x="748" y="254" fill="#f0e8d6">#705C30</text>
    <rect x="845" y="150" width="95" height="110" rx="8" fill="#9c2e26"/>
    <text x="853" y="236" fill="#ffffff" font-weight="700">Danger</text><text x="853" y="254" fill="#f6dcd9">#9C2E26</text>
  </g>
  <text x="20" y="300" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#5e6661">Source: app/globals.css (CSS custom properties). Border colour is the accent at 15% opacity: rgba(74,124,89,0.15).</text>
  <text x="20" y="322" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#5e6661">Gold on the dark shell is documented in the CSS as 9.7:1 contrast on #0B1A15.</text>
</svg>
