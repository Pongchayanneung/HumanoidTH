<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F7 Search wireframe</title>
<style>
:root{--background:#faf6f0;--surface:#fff;--surface-muted:#f4f0e8;--border:rgba(74,124,89,.25);--text-primary:#2e3230;--text-secondary:#5e6661;--focus-ring-dark:#d6be67;--accent:#4a7c59;--accent-strong:#365b41;--warning:#705c30;--danger:#9c2e26;--sidebar:#0b1a15;--gold:#e7bd55;--font-sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box} body{margin:0;background:#e9e5dc;color:var(--text-primary);font:14px/1.55 var(--font-sans)} button,input,select{font:inherit} button,a,select{cursor:pointer} :focus-visible{outline:2px solid var(--accent-strong);outline-offset:3px} .dark :focus-visible{outline-color:var(--focus-ring-dark)} .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.controls{padding:16px 20px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:end;gap:16px;flex-wrap:wrap}.controls label{display:grid;gap:3px;font-weight:650}.controls select{min-height:40px;min-width:120px;padding:6px;border:1px solid #777;border-radius:5px;background:white}.controls p{margin:0;color:#514a3d}.stage{overflow-x:auto;padding:20px}.frame{width:1440px;min-height:900px;background:var(--background);display:flex;position:relative;box-shadow:0 3px 14px #0002}.frame.mobile{width:390px;min-height:844px;display:block;overflow:hidden}.skip{min-height:44px;position:absolute;left:8px;top:-100px;z-index:10;background:white;padding:10px}.skip:focus{top:8px}.sidebar{width:230px;flex:none;background:var(--sidebar);color:#fff;padding:20px 13px;display:flex;flex-direction:column}.logo{display:block;width:180px;height:70px;object-fit:contain;object-position:left center}.nav{display:grid;gap:2px;margin-top:12px}.nav a{color:#f6f5ef;text-decoration:none;padding:8px 12px;min-height:39px;border-radius:6px;display:flex;gap:11px;align-items:center}.nav a.active{background:#28553a;border-left:4px solid var(--gold);padding-left:8px;font-weight:700}.ico{display:inline-flex;width:20px;justify-content:center;font-size:17px}.lang{display:flex;margin-top:auto;border:1px solid #819b87;border-radius:7px;overflow:hidden}.lang button{flex:1;border:0;background:transparent;color:white;min-height:44px}.lang button[aria-pressed=true]{background:var(--gold);color:#102619;font-weight:700}.main{min-width:0;flex:1;padding:36px 42px 65px}.heading{display:flex;align-items:start;justify-content:space-between;gap:16px}h1{font-size:36px;line-height:1.18;color:#173d2a;margin:0 0 8px}h2{font-size:18px;margin:0}h3{font-size:17px;margin:0}.desc{margin:0 0 24px;color:var(--text-secondary)}.stamp{border:2px solid #9c4827;color:#813c20;border-radius:4px;padding:5px 9px;font-weight:750;white-space:nowrap;font-size:12px}.search-form{display:flex;gap:8px}.search-field{position:relative;flex:1;min-width:0}.search-form .search-field input{padding-right:50px}.search-field input::-webkit-search-cancel-button{display:none}.clear-search{position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;font-size:22px;color:var(--text-secondary)}.search-form input{width:100%;min-width:0;border:1px solid #9aab9b;background:#fff;border-radius:7px;padding:12px 14px;font-size:17px}.primary,.action{min-height:44px;border-radius:6px;padding:9px 18px;border:1px solid #234d32;text-decoration:none;text-align:center;font-weight:700}.primary{background:#214d32;color:white}.action{background:transparent;color:#214d32}.status{margin:13px 0 0;border:1px solid #d2d5c8;background:#f4f3ed;border-radius:7px;padding:12px 14px;min-height:48px}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px}.stale-note{margin:6px 0 0}.status.warn,.banner{background:#fff0d2;border:1px solid #ba8e3e;color:#5a481f}.banner{border-radius:7px;padding:12px 14px;margin-top:12px}.coverage{display:inline-block;background:#f3dfb5;color:#57451f;border-radius:5px;padding:3px 7px}.filters{display:flex;flex-wrap:wrap;gap:8px;padding:14px 2px;scrollbar-width:thin}.filters button{flex:none;min-height:44px;padding:8px 16px;background:transparent;border:1px solid #a2aea0;border-radius:24px;color:#273e30}.filters button[aria-pressed=true]{background:#254e34;color:white;border-color:#254e34}.result-head{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 10px}.note{color:var(--text-secondary);margin:0;font-size:12px}.cards{display:grid;gap:12px}.card{border:1px solid #d5c8ae;border-radius:9px;overflow:hidden;background:#fffdf9}.card header{background:#efe8db;padding:12px 15px;display:flex;gap:10px;align-items:baseline}.badge{background:#315b3e;color:white;border-radius:5px;padding:4px 9px;font-size:12px;font-weight:700;white-space:nowrap}.title{color:#1c3827;text-decoration:none}.title:hover{text-decoration:underline}.evidence{padding:12px 15px;display:grid;grid-template-columns:auto 1fr;gap:10px;border-top:1px solid #e6dfd3}.evidence-meta{display:flex;align-items:start;gap:6px;flex-wrap:wrap}.tag{font-size:12px;background:#f2e5cd;border-radius:4px;padding:3px 6px;white-space:nowrap}.quote{margin:0}.annotation{background:#e6eedb;border:1px solid #aabf96;border-radius:6px;padding:7px 9px;margin-top:8px;width:max-content;max-width:100%;font-size:12px}.card-actions{display:flex;gap:8px;padding:0 15px 14px}.original{margin:0 15px 14px;padding:10px;border-left:3px solid var(--accent);background:#f5f4ec}.state-panel{border:1px solid #d6cbb8;border-radius:8px;padding:28px;background:#fffdf8}.state-panel.error{border-color:var(--danger)}.skeleton{height:112px;border:1px solid #ddd6c9;border-radius:8px;background:linear-gradient(90deg,#eeeae2 25%,#f8f6f0 45%,#eeeae2 65%);background-size:200% 100%;animation:shimmer 1.8s infinite}.skeleton+.skeleton{margin-top:12px}@keyframes shimmer{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
.mobile-header,.mobile-tabs{display:none}.mobile .sidebar{display:none}.mobile .mobile-header{display:flex;background:var(--sidebar);align-items:center;justify-content:space-between;padding:8px 12px;color:white}.mobile .mobile-header .logo{width:165px;height:52px}.mobile-header-actions{display:flex;align-items:center}.mobile-profile{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;color:white;text-decoration:none;font-size:23px}.mobile .mobile-header .lang{margin:0;width:112px}.mobile .mobile-header .lang button{min-width:50px}.mobile .main{padding:20px 14px 100px}.mobile h1{font-size:27px}.mobile .heading{align-items:start}.mobile .stamp{white-space:normal;text-align:center;max-width:112px}.mobile .desc{margin-bottom:16px}.mobile .search-form input{font-size:16px}.mobile .search-form .primary{padding:8px 13px}.mobile .filters{flex-wrap:nowrap;overflow-x:auto;margin-right:-14px}.mobile .result-head{flex-wrap:wrap;column-gap:8px;row-gap:4px}.mobile .card header{display:block}.mobile .card h3{margin-top:6px}.mobile .card h3 a.title{display:inline-flex;align-items:center;min-height:44px;max-width:100%}.mobile .evidence{display:block}.mobile .quote{margin-top:8px}.mobile .card-actions{display:grid;grid-template-columns:1fr 1fr}.mobile .card-actions>*{padding:9px 5px}.mobile .mobile-tabs{display:flex;position:sticky;bottom:0;background:var(--sidebar);z-index:2}.mobile .mobile-tabs a{flex:1;min-width:0;min-height:64px;padding:7px 1px;color:white;text-decoration:none;text-align:center;font-size:12px;line-height:1.2;overflow-wrap:anywhere}.mobile .mobile-tabs a[aria-current]{border-top:4px solid var(--gold);color:var(--gold);background:#1d3b28}.mobile .mobile-tabs .ico{display:block;width:auto;font-size:19px;margin-bottom:3px}
</style>
</head>
<body>
<div class="controls" aria-label="Wireframe controls">
<label>Language <select id="lang"><option value="en">EN</option><option value="th">TH</option></select></label>
<label>Viewport <select id="vp"><option value="1440">1440</option><option value="390">390</option></select></label>
<label>State <select id="state"><option value="browse">Browse</option><option value="hybrid">Hybrid: full coverage</option><option value="partial">Hybrid: partial coverage</option><option value="keyword">Keyword fallback</option><option value="loading">Loading</option><option value="empty">Empty</option><option value="failure">Failure / unavailable</option><option value="stale">Stale guard</option></select></label>
<p>Network has no mobile entry in F7 (desktop sidebar and URL only). Recorded for the navigation owner to revisit.</p>
</div>
<div class="stage"><div class="frame" id="frame"></div></div>
<script>
const copy={en:{title:'Search the atlas',desc:'Find related public papers, repositories, videos, robots and records in Thai or English.',placeholder:'e.g. social robot elderly care',search:'Search',all:'All',types:['Papers','Repositories','Videos','News & web','Robots','Contributions','Perspectives','Inventory','Relationships','Organizations','Sources'],nav:['Search','Overview','Dashboard','Data Pulls','Map','Network','Perspectives','Robots','Inventory','Contributors','Analytics','Database','Submit','Admin','Profile'],browse:'Public records, not matched to a query.',loading:'Searching…',hybrid:'Meaning + keyword search',keyword:'Meaning-based search is offline; showing keyword matches. Thai queries may miss English records, and the reverse.',keywordStatus:'Keyword matches only',partial:'6,512 of 6,714 records indexed (example)',time:'Index built 6 Nov 2026, 14:20 (example)',empty:'No matching public records.',failure:'Search is unavailable right now.',retry:'Retry',show:'Show original',hide:'Hide original',source:'Go to source',newtab:' (opens in new tab)',related:'Related information, not a verified answer.',original:'Original:',paper:'Paper',robot:'Robot',perspective:'Perspective',abstract:'Abstract excerpt',catalog:'Catalog summary',evidence:'Evidence excerpt',theme:'Theme: Care & wellbeing',stance:'Stance: Supportive',example:'Example',results:'Public records',skip:'Skip to search',navLabel:'Primary navigation',language:'Language',clear:'Clear search',stale:'A newer search replaced this one. Older results are removed at once; only the latest response is shown.',query:'social robot elderly care'},th:{title:'ค้นหาในแอตลาส',desc:'ค้นหางานวิจัย คลังโค้ด วิดีโอ หุ่นยนต์ และข้อมูลสาธารณะที่เกี่ยวข้อง ได้ทั้งภาษาไทยและอังกฤษ',placeholder:'เช่น หุ่นยนต์ดูแลผู้สูงอายุ',search:'ค้นหา',all:'ทั้งหมด',types:['งานวิจัย','คลังโค้ด','วิดีโอ','ข่าวและเว็บ','หุ่นยนต์','ผลงานร่วมพัฒนา','มุมมองสาธารณะ','รายการอุปกรณ์','ความสัมพันธ์','องค์กร/หน่วยงาน','แหล่งข้อมูล'],nav:['ค้นหา','ภาพรวม','แดชบอร์ด','ดึงข้อมูล API','แผนที่','เครือข่าย','มุมมองสาธารณะ','คลังรุ่นหุ่นยนต์','รายการอุปกรณ์ทีม','ผู้ร่วมพัฒนา','การวิเคราะห์','ฐานข้อมูลดิบ','ส่งข้อมูล','ผู้ดูแลระบบ','โปรไฟล์ระบบ'],browse:'ข้อมูลสาธารณะ ยังไม่ได้จับคู่กับคำค้น',loading:'กำลังค้นหา…',hybrid:'ค้นหาตามความหมายและคำค้น',keyword:'ระบบค้นหาเชิงความหมายไม่พร้อม แสดงผลแบบคำค้นตรงตัว คำค้นภาษาไทยอาจไม่พบข้อมูลภาษาอังกฤษ และกลับกัน',keywordStatus:'ผลการค้นหาตามคำค้นตรงตัวเท่านั้น',partial:'จัดทำดัชนีแล้ว 6,512 จาก 6,714 รายการ (ตัวอย่าง)',time:'สร้างดัชนีเมื่อ 6 พ.ย. 2026, 14:20 (ตัวอย่าง)',empty:'ไม่พบข้อมูลสาธารณะที่ตรงกัน',failure:'ขณะนี้ไม่สามารถค้นหาได้',retry:'ลองอีกครั้ง',show:'แสดงต้นฉบับ',hide:'ซ่อนต้นฉบับ',source:'เปิดแหล่งที่มา',newtab:' (เปิดในแท็บใหม่)',related:'ข้อมูลที่เกี่ยวข้อง ไม่ใช่คำตอบที่ยืนยันแล้ว',original:'ต้นฉบับ:',paper:'งานวิจัย',robot:'หุ่นยนต์',perspective:'มุมมองสาธารณะ',abstract:'ข้อความบางส่วนจากบทคัดย่อ',catalog:'สรุปจากแคตตาล็อก',evidence:'ข้อความอ้างอิงบางส่วน',theme:'หัวข้อ: การดูแลและสุขภาวะ',stance:'จุดยืน: สนับสนุน',example:'ตัวอย่าง',results:'ข้อมูลสาธารณะ',skip:'ข้ามไปยังการค้นหา',navLabel:'เมนูหลัก',language:'ภาษา',clear:'ล้างคำค้น',stale:'มีการค้นหาใหม่แทนที่แล้ว ผลเก่าถูกลบทันที และแสดงเฉพาะผลล่าสุด',query:'หุ่นยนต์ดูแลผู้สูงอายุ'}};
const navIcons=['⌕','⌂','▦','▣','◇','◉','▤','♙','□','♧','▥','▤','➤','⚙','○'];
const paths=['#search','#overview','#dashboard','#data-pulls','#map','#network','#perspectives','#robots','#inventory','#contributions','#analytics','#database','#submit','#admin','#profile'];
let lang='en',vp='1440',state='browse',filter=0,query='';
const $=id=>document.getElementById(id);
function syncHash(replace=false){const hash=new URLSearchParams({lang,vp,state,query,type:String(filter)}).toString();if(replace)history.replaceState(null,'','#'+hash);else location.hash=hash}
function langButtons(){return `<div class="lang" role="group" aria-label="${copy[lang].language}"><button type="button" data-lang="th" aria-pressed="${lang==='th'}">TH</button><button type="button" data-lang="en" aria-pressed="${lang==='en'}">EN</button></div>`}
function card(i,t){const data=[{kind:t.paper,title:'Example paper about elder-care robots',language:'en',limit:t.abstract,quote:'“Example: We explore how a social robot can support daily care for older adults in home settings.”',extra:true},{kind:t.robot,title:'ตัวอย่างชื่อรุ่นหุ่นยนต์บริการ',language:'th',limit:t.catalog,quote:'“ตัวอย่าง: หุ่นยนต์บริการสำหรับผู้สูงอายุ ออกแบบเพื่อช่วยดูแลในชีวิตประจำวัน”'},{kind:t.perspective,title:'Example viewpoint on social robots in elderly care',language:'en',limit:t.evidence,quote:'“Example: Social robots can support social interaction for older adults.”',annotation:true}][i];const evidence=(d)=>`<div class="evidence"><div class="evidence-meta"><span aria-hidden="true">▤</span>${d.kind&&d.kind!==data.kind?`<span class="badge">${d.kind}</span>`:''}<span class="tag">${t.original} ${d.language==='th'?(lang==='th'?'ไทย':'Thai'):(lang==='th'?'อังกฤษ':'English')}</span><span class="tag">${d.limit}</span></div><div><p class="quote" lang="${d.language}">${d.quote}</p>${d.annotation?`<div class="annotation">${t.theme}<br>${t.stance}</div>`:''}</div></div>`;return `<article class="card"><header><span class="badge">${data.kind}</span><h3><a class="title" href="#original-${i}" lang="${data.language}">${data.title}</a></h3></header>${evidence(data)}${data.extra?evidence({kind:t.perspective,language:'th',limit:t.evidence,quote:'“ตัวอย่าง: หุ่นยนต์สังคมอาจช่วยเพิ่มโอกาสในการมีปฏิสัมพันธ์ทางสังคม”',annotation:true}):''}<div class="card-actions"><button class="primary expand" type="button" aria-expanded="false" aria-controls="original-${i}">${t.show}</button><a class="action" href="https://example.org/" target="_blank" rel="noopener noreferrer">${t.source} ↗<span class="sr">${t.newtab}</span></a></div><div id="original-${i}" class="original" hidden><p lang="${data.language}">${data.quote}</p></div></article>`}
function render(){const previousInput=$('search-input');const focused=document.activeElement===previousInput;const t=copy[lang];document.documentElement.lang=lang;const mobile=vp==='390';$('frame').className='frame'+(mobile?' mobile':'');const tabs=[1,2,0,7,9];let status=state==='browse'?t.browse:state==='keyword'?t.keywordStatus:state==='loading'?t.loading:state==='stale'?t.time:state==='failure'?t.failure:t.hybrid;let statusExtra=(state==='hybrid'||state==='partial'||state==='keyword'||state==='empty')?` · ${t.time}`:'';let coverage=state==='partial'?` <span class="coverage">${t.partial}</span>`:'';let body=state==='loading'||state==='stale'?'<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>':state==='empty'?`<div class="state-panel">${t.empty}</div>`:state==='failure'?`<div class="state-panel error" role="alert">${t.failure} <button class="action retry" type="button">${t.retry}</button></div>`:[0,1,2].filter(i=>filter===0||[1,5,7][i]===filter).map(i=>card(i,t)).join('');$('frame').innerHTML=`<a class="skip" href="#search-input">${t.skip}</a><aside class="sidebar dark"><img class="logo" src="../../public/logo.png" alt="Thailand Humanoid Atlas"><nav class="nav" aria-label="${t.navLabel}">${t.nav.map((n,i)=>`<a href="${paths[i]}" ${i===0?'class="active" aria-current="page"':''}><span class="ico" aria-hidden="true">${navIcons[i]}</span>${n}</a>`).join('')}</nav>${langButtons()}</aside><header class="mobile-header dark"><img class="logo" src="../../public/logo.png" alt="Thailand Humanoid Atlas"><div class="mobile-header-actions">${langButtons()}<a href="#profile" class="mobile-profile" aria-label="${t.nav[14]}"><span aria-hidden="true">◉</span></a></div></header><main class="main"><div class="heading"><div><h1>${t.title}</h1><p class="desc">${t.desc}</p></div><div class="stamp">WIREFRAME<br>${lang==='th'?'ข้อมูลตัวอย่าง':'example data'}</div></div><form class="search-form" role="search"><label class="sr" for="search-input">${t.search}</label><div class="search-field"><input id="search-input" type="search" placeholder="${t.placeholder}"><button class="clear-search" type="button" aria-label="${t.clear}" hidden>×</button></div><button class="primary" type="submit">${t.search}</button></form><div class="status" ${state==='failure'?'':'aria-live="polite"'}>${state==='hybrid'||state==='partial'?'<span class="status-dot" aria-hidden="true"></span>':''}${status}${statusExtra}${coverage}${state==='stale'?`<p class="stale-note">${t.stale}</p>`:''}</div>${state==='keyword'?`<div class="banner">${t.keyword}</div>`:''}<div class="filters" role="group" aria-label="${lang==='th'?'ประเภทข้อมูล':'Record type'}">${[t.all,...t.types].map((x,i)=>`<button type="button" data-filter="${i}" aria-pressed="${filter===i}">${x}</button>`).join('')}</div><section aria-labelledby="results-heading" aria-busy="${state==='loading'||state==='stale'}"><div class="result-head"><h2 id="results-heading">${t.results}</h2><p class="note">${t.related}</p></div><div class="cards">${body}</div></section></main><nav class="mobile-tabs dark" aria-label="${t.navLabel}">${tabs.map(i=>`<a href="${paths[i]}" ${i===0?'aria-current="page"':''}><span class="ico" aria-hidden="true">${navIcons[i]}</span>${t.nav[i]}</a>`).join('')}</nav>`;
const input=$('search-input');input.value=query;const clear=$('frame').querySelector('.clear-search');const updateClear=()=>{clear.hidden=!input.value};updateClear();input.addEventListener('input',()=>{query=input.value;updateClear();syncHash(true)});clear.onclick=()=>{query='';state='browse';$('state').value=state;syncHash();render();$('search-input').focus()};if(focused)input.focus();$('frame').querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;$('lang').value=lang;syncHash();render()});$('frame').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=Number(b.dataset.filter);syncHash();render();$('frame').querySelector(`[data-filter="${filter}"]`).focus()});$('frame').querySelectorAll('.expand').forEach(b=>b.onclick=()=>{const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));$(b.getAttribute('aria-controls')).hidden=open;b.textContent=open?t.show:t.hide});$('frame').querySelector('.search-form').onsubmit=e=>{e.preventDefault();state=query.trim()?'loading':'browse';$('state').value=state;syncHash();render();$('search-input').focus()};const retry=$('frame').querySelector('.retry');if(retry)retry.onclick=()=>{state='loading';$('state').value=state;syncHash();render()}}
function readHash(){const p=new URLSearchParams(location.hash.slice(1));lang=['en','th'].includes(p.get('lang'))?p.get('lang'):'en';vp=['1440','390'].includes(p.get('vp'))?p.get('vp'):'1440';state=[...$('state').options].some(o=>o.value===p.get('state'))?p.get('state'):'browse';$('lang').value=lang;$('vp').value=vp;$('state').value=state;query=p.get('query')??(state==='browse'?'':copy[lang].query);const type=p.get('type');filter=type!==null&&/^(0|[1-9]|1[01])$/.test(type)?Number(type):0;render()}
['lang','vp','state'].forEach(id=>$(id).addEventListener('change',()=>{lang=$('lang').value;vp=$('vp').value;state=$('state').value;syncHash();render()}));window.addEventListener('hashchange',readHash);document.addEventListener('keydown',e=>{if(e.code==='Slash'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&vp==='1440'){e.preventDefault();$('search-input').focus()}});readHash();
</script>
</body>
</html>
